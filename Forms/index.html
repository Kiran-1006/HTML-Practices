<html>
    <head>
        <title>
            Form
        </title>
    </head>
    <body>
        <h2>
            This is my form
        </h2>
        <form>
            Name :
            <input type="text" name="name"placeholder="Enter your name" required><br><br>

            Father's Name : 
            <input type="text" name="fname"placeholder="Enter your father's name"><br><br>
            
            Mother's Nmae : 
            <input type="text" name="mname"placeholder="Enter your mother's name"><br><br>

            Phone number :
            <input type="number" name="number"><br><br>

            Date of birth :
            <input type="date" name="dob"><br><br>

            Address :
           <textarea name="address" rows="3" cols="20"> </textarea><br><br>

            Gender :
            <input type="radio" name="gender" value="Female">Female
            <input type="radio" name="gender" value="male">Male 
            <input type="radio" name="gender" value="other">Other<br><br>

            Hobby : 
            <input type="checkbox" name="hobby" value="Running">Running     
            <input type="checkbox" name="hobby" value="swimming">Swimming
            <input type="checkbox" name="hobby" value="singing">Singing<br><br>

            City :
            <select name="city">
                <option>Select City</option> 
                <option>Chandausi</option> 
                <option>Moradabad</option> 
                <option>Sambhal</option> 
                <option>Babrala</option>

            </select><br><br>

            Upload Image :
            <input type="file" name="photo"><br><br>

            Upload Singnature :
            <input type="file" name="singnature"><br><br>

            Submittied Time :
            <input type="time" name="time"><br><br>

            <input type="submit" name="save">
            <input type="reset" name="Reset">
        </form>
    </body>
</html>
