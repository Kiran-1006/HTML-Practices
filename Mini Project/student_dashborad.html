<!DOCTYPE html>
<html>
    <head>
        <title>
            Student Result Dashboard
        </title>
        <style>
            body{
                background-color: rgb(181, 220, 240);
                margin: 0;
            }
            .container{
                max-width: 900px;
                margin:30px auto;  
                background-color: white;
                padding:20px;
                border:3px solid black;
                box-sizing: border-box;
                position: relative;
            }
            .badge{
                background-color: yellow;
                border-radius: 10px;
                top:10px;
                right:10px;
                padding: 10px;
                position:absolute;
                border:1px solid black;
            }
            h1{
                text-align: center;
                text-decoration: underline;
                color:blue;
            }
            .profile{
                display: flex;
                justify-content: space-between;
                gap:20px;
                margin-top: 20px;
            }
            .card{
                width:45%;
                background-color: aliceblue;
                padding:15px;
                border:2px solid #2196f3;
                outline:3px dashed #90caf9;
            }
            table , th , td{
                border:1px solid black;
            }
            table{
                width:100%;
                margin-top: 20px;
                text-align: center;
                border-collapse: collapse;
            }
            th{
                background-color: #095db1;
                color:white;
            }
            th , td{
                padding:10px;
            }
            .links{
                text-align: center;
                margin-top: 25px;
            }
            .links a{
                text-decoration: none;
                margin: 10px;
                padding: 10px 15px;
                border:2px solid blue;
                border-radius: 10px;
            }
            .links a:hover{
                background-color: blue;
                color:white;
            }
        </style>
    </head>
    <body>
      <div class="container">

        <div class="badge">Topper ⭐</div>

        <h1>Student Result Dashboard</h1>

        <div class="profile">

        <div class="card">
            <h2> 🤗 Student Details</h2>
        <ul>
            <li>Name:Kiran</li>
            <li>Course:Polytechnic CSE</li>
            <li>City:Chandausi</li>
        </ul>
        </div>

        <div class="card">
            <h2> 📚 Skills</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>React JS</li>
        </ul>
        </div>
        </div>

        <h2> Result Table</h2>
        <table>
            <tr>
                <th>
                    Subject
                </th>
                <th>
                    Marks
                </th>
            </tr>
            <tr>
                <td>HTML</td>
                <td>90</td>
            </tr>
              <tr>
                <td>CSS</td>
                <td>95</td>
            </tr>
              <tr>
                <td>JavaScript</td>
                <td>85</td>
            </tr>
        </table>

        <div class="links">
            <a href="https://www.linkedin.com/in/kiran-354230405/" target="_blank">LinkedIn</a>
            <a href="https://www.snapchat.com/add/koshibaghel?share_id=7znMfPrxVhY&locale=en-IN" target="_blank">Snapchat</a>
        </div>

      </div>
    </body>
</html>
