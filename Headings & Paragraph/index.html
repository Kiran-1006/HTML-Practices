<!DOCTYPE html>
<html>
  <head>
    <title>Headings and Paragraph</title>
  </head>
  <body>
        <!--Headings-->

        <h1>My Website</h1>
        <h2>About Me</h2>
        <h3>I love building web pages.</h3>
        <h4>My Hobbies</h4>
        <h5>Photography</h5>
        <h6>I enjoy taking photos of nature.</h6>

        <!--Paragraph-->
        
          <h1>A Short Poem</h1>

          <p>Twinkle twinkle little star,<br>
              How I wonder what you are.</p>
            <hr>
              <pre>Up above the world so high,
              Like a diamond in the sky.</pre>

  </body>
</html>
